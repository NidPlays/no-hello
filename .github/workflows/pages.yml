name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on (and sets the source to Actions)
      # the first time this runs, so the deploy below doesn't 404 on a repo
      # where Pages was never switched on by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain HTML/CSS/JS — no build step, so the repo root
      # is uploaded as-is. .nojekyll keeps Jekyll from touching it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
